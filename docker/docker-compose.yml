version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ..:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY:-base64:ZHVtbXlrZXlGb3JMb2NhbERldk9ubHk=}
      - APP_ALLOW_HTTP=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vaultern_db
      - DB_USERNAME=vaultern
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force --no-interaction || true &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: vaultern_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: vaultern_db
      MYSQL_USER: vaultern
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaultern_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  horizon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_horizon
    restart: unless-stopped
    command: php artisan horizon
    depends_on:
      - mysql
      - redis

  reverb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_reverb
    restart: unless-stopped
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    depends_on:
      - redis

volumes:
  mysql_data:
  redis_data:
