version: "3.9"

# Stack orientado a cPanel: MySQL + cola database + (opcional) Reverb solo en local.
# Sin Redis / Horizon.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ..:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY:-base64:ZHVtbXlrZXlGb3JMb2NhbERldk9ubHk=}
      - APP_ALLOW_HTTP=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vaultern_db
      - DB_USERNAME=vaultern
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-log}
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force --no-interaction || true &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: vaultern_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: vaultern_db
      MYSQL_USER: vaultern
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Equivalente al cron de cPanel: procesa jobs de la tabla `jobs`.
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_queue
    restart: unless-stopped
    command: php artisan queue:work database --tries=3 --timeout=90
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-log}
      - CACHE_STORE=file
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vaultern_db
      - DB_USERNAME=vaultern
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - ..:/var/www/html

  # Solo desarrollo local. En cPanel no corre Reverb (usar BROADCAST_CONNECTION=log).
  reverb:
    profiles: ["realtime"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vaultern_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      - REVERB_APP_ID=${REVERB_APP_ID:-vaultern}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-behblv1hznnbqwpu0cxo}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-c3hsfp4udwzkw2vjcofr}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_HOST=localhost
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - ..:/var/www/html
    depends_on:
      - app

volumes:
  mysql_data:
